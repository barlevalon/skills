name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Check personal skills and local Markdown links
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          import subprocess
          from urllib.parse import unquote, urlsplit

          root = Path.cwd()
          errors = []
          skills = sorted(path for path in (root / "skills").iterdir() if path.is_dir())
          for skill in skills:
              for name in ("SKILL.md", "README.md", "LICENSE"):
                  if not (skill / name).is_file():
                      errors.append(f"{skill.name}: missing {name}")
              entry = skill / "SKILL.md"
              if entry.is_file():
                  content = entry.read_text()
                  frontmatter = re.match(r"\A---\n(.*?)\n---(?:\n|$)", content, re.S)
                  metadata = frontmatter[1] if frontmatter else ""
                  name_matches = re.search(rf"^name: {re.escape(skill.name)}$", metadata, re.M)
                  if not name_matches or not re.search(r"^description:", metadata, re.M):
                      errors.append(f"{entry.relative_to(root)}: invalid skill metadata")

          files = subprocess.check_output(["git", "ls-files", "-z", "--", "*.md"]).decode().split("\0")
          checked = 0
          for name in filter(None, files):
              path = root / name
              if not path.is_file():
                  continue
              content = re.sub(r"^```.*?^```[^\n]*$", "", path.read_text(), flags=re.M | re.S)
              for target in re.findall(r"\[[^\]]*\]\(([^)]+)\)", content):
                  url = urlsplit(target)
                  if url.scheme or url.netloc:
                      continue
                  destination = (path.parent / unquote(url.path)).resolve() if url.path else path
                  if not destination.is_relative_to(root) or not destination.exists():
                      errors.append(f"{name}: broken local link {target}")
                  checked += 1
          if errors:
              raise SystemExit("\n".join(errors))
          print(f"Checked {len(skills)} personal skills and {checked} local Markdown links")
          PY
